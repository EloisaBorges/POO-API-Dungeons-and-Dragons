<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="cabecalho(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Grimório de Magias · ' + ${titulo}">Grimório de Magias</title>
    <link rel="stylesheet" th:href="@{/css/estilo.css}">
</head>

<body>

    <!-- ============================ MENU ============================ -->
    <header th:fragment="menu(ativo)" class="topo">
        <div class="topo-interno">
            <a class="marca" th:href="@{/grimorio}">
                <span class="runa">✦</span>
                <span>Grimório de Magias</span>
            </a>
            <nav class="menu">
                <a th:href="@{/grimorio}" th:classappend="${ativo == 'grimorio'} ? 'ativo' : ''">Meu Grimório</a>
                <a th:href="@{/buscar}" th:classappend="${ativo == 'buscar'} ? 'ativo' : ''">Buscar Magias</a>
                <a th:href="@{/preparadas}" th:classappend="${ativo == 'preparadas'} ? 'ativo' : ''">
                    Preparadas <span class="contador-preparadas" data-contador-preparadas>0</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- ========================== MENSAGENS ========================== -->
    <div th:fragment="mensagens" class="mensagens">
        <p class="aviso sucesso" th:if="${sucesso}" th:text="${sucesso}"></p>
        <p class="aviso atencao" th:if="${aviso}" th:text="${aviso}"></p>
        <p class="aviso erro" th:if="${erro}" th:text="${erro}"></p>
    </div>

    <!-- ============================ RODAPÉ ============================ -->
    <footer th:fragment="rodape" class="rodape">
        <p>
            Dados das magias fornecidos pela
            <a href="https://www.dnd5eapi.co/api" target="_blank" rel="noopener">D&amp;D 5e SRD API</a>
            · Trabalho de Programação Orientada a Objetos · IFPR Campus Cascavel
        </p>
    </footer>

</body>

</html>
