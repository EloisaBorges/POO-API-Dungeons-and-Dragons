spring.application.name=D-D

# Aqui a gente diz pro Spring onde fica o banco de dados.
# Estamos usando o H2, um banco que fica salvo direto num arquivo
# (pasta "dados/"), sem precisar instalar nada separado no computador.
spring.datasource.url=jdbc:h2:file:./dados/grimorio;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update faz o Hibernate (parte do Spring que conversa com o
# banco) criar ou ajustar a tabela "magia" sozinho, toda vez que a
# aplicação inicia, baseado nos campos da classe Magia.java.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Porta onde o site vai rodar: http://localhost:8080
server.port=8080
