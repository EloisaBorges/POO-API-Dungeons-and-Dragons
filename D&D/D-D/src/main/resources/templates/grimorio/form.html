<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: cabecalho('Cadastrar Magia')}"></head>

<body>

    <header th:replace="~{fragments/layout :: menu('grimorio')}"></header>

    <main class="conteudo estreito">

        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <h1 th:text="${magia.novo} ? 'Nova magia' : 'Editar magia'">Nova magia</h1>
        <p class="legenda">
            Use este formulário para criar magias próprias da sua mesa ou ajustar
            uma magia que veio da API.
        </p>

        <form class="painel formulario" method="post" th:action="@{/grimorio/salvar}" th:object="${magia}">

            <input type="hidden" th:field="*{id}">

            <div class="linha">
                <div class="campo cresce">
                    <label for="nomeMagia">Nome *</label>
                    <input type="text" id="nomeMagia" th:field="*{nome}" required maxlength="150">
                </div>

                <div class="campo">
                    <label for="nivelMagia">Nível *</label>
                    <select id="nivelMagia" th:field="*{nivel}">
                        <option value="0">Truque</option>
                        <option th:each="n : ${#numbers.sequence(1, 9)}" th:value="${n}" th:text="${n} + 'º círculo'">
                        </option>
                    </select>
                </div>

                <div class="campo">
                    <label for="escolaMagia">Escola</label>
                    <select id="escolaMagia" th:field="*{escola}">
                        <option value="">—</option>
                        <option th:each="e : ${escolas}" th:value="${e}" th:text="${e.nome}"></option>
                    </select>
                </div>
            </div>

            <div class="linha">
                <div class="campo cresce">
                    <label for="tempo">Tempo de conjuração</label>
                    <input type="text" id="tempo" th:field="*{tempoConjuracao}" placeholder="1 ação">
                </div>
                <div class="campo cresce">
                    <label for="alcance">Alcance</label>
                    <input type="text" id="alcance" th:field="*{alcance}" placeholder="18 metros">
                </div>
                <div class="campo cresce">
                    <label for="duracao">Duração</label>
                    <input type="text" id="duracao" th:field="*{duracao}" placeholder="Instantânea">
                </div>
            </div>

            <fieldset class="campo caixas">
                <legend>Componentes</legend>
                <label th:each="comp : ${componentesDisponiveis}" class="caixa" th:title="${comp.explicacao}">
                    <input type="checkbox" name="componentesSelecionados" th:value="${comp.sigla}"
                        th:checked="${magia.temComponente(comp)}">
                    <span th:text="${comp.sigla} + ' · ' + ${comp.nome}">V · Verbal</span>
                </label>
            </fieldset>

            <div class="campo">
                <label for="materiais">Componentes materiais</label>
                <input type="text" id="materiais" th:field="*{materiais}"
                    placeholder="Uma pitada de enxofre e guano de morcego">
            </div>

            <fieldset class="campo caixas">
                <legend>Classes que podem conjurar</legend>
                <label th:each="c : ${classes}" class="caixa">
                    <input type="checkbox" name="classesSelecionadas" th:value="${c.indice}"
                        th:checked="${magia.ehConjuradaPor(c)}">
                    <span th:text="${c.nome}">Mago</span>
                </label>
            </fieldset>

            <fieldset class="campo caixas">
                <legend>Propriedades</legend>
                <label class="caixa">
                    <input type="checkbox" th:field="*{ritual}"> <span>Pode ser conjurada como ritual</span>
                </label>
                <label class="caixa">
                    <input type="checkbox" th:field="*{concentracao}"> <span>Exige concentração</span>
                </label>
            </fieldset>

            <div class="campo">
                <label for="descricao">Descrição</label>
                <textarea id="descricao" rows="8" th:field="*{descricao}"></textarea>
            </div>

            <div class="campo">
                <label for="superiores">Em níveis superiores</label>
                <textarea id="superiores" rows="3" th:field="*{niveisSuperiores}"></textarea>
            </div>

            <div class="campo">
                <label for="anotacoes">Minhas anotações de mesa</label>
                <textarea id="anotacoes" rows="3" th:field="*{anotacoes}"
                    placeholder="Ex.: guardar para emboscadas, combina com Aprisionar"></textarea>
            </div>

            <div class="campo-botoes">
                <button type="submit" class="botao">Salvar</button>
                <a class="botao texto" th:href="@{/grimorio}">Cancelar</a>
            </div>
        </form>

    </main>

    <footer th:replace="~{fragments/layout :: rodape}"></footer>
    <script th:src="@{/js/preparadas.js}"></script>
</body>

</html>
