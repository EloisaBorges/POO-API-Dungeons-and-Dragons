<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Preparadas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>

<nav th:replace="~{menu :: menu}"></nav>

<h1>Magias Preparadas</h1>
<p>Essa lista fica salva no seu navegador.</p>

<!-- Importante: o Java manda TODAS as magias do banco para essa página
     (veja PreparadasController). É o JavaScript (preparadas.js) que
     esconde as que não estão marcadas, olhando o localStorage.
     Por isso a classe "carta-preparada" e o atributo data-id em cada
     div: é por eles que o JavaScript encontra e esconde/mostra cada
     magia. -->
<div th:each="magia : ${magias}" class="carta carta-preparada" th:attr="data-id=${magia.id}">
    <!-- Aqui o botão já começa com estrela cheia (★), porque nessa tela
         só sobrevivem as que já estão marcadas -->
    <button class="favorito" th:attr="data-id=${magia.id}" onclick="alternar(this.getAttribute('data-id'))">★</button>
    <h3 th:text="${magia.nome}">Nome</h3>
    <p th:text="'Nível ' + ${magia.nivel} + ' - ' + ${magia.escola}"></p>
    <p th:text="'Componentes: ' + ${magia.componentes}"></p>
</div>

<script src="/js/preparadas.js"></script>
</body>
</html>
