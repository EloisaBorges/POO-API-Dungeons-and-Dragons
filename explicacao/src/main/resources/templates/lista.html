<!DOCTYPE html>
<!-- xmlns:th é o que liga esse HTML ao Thymeleaf, o "motor" que troca
     ${variavel} pelo valor de verdade antes de mandar a página pro navegador -->
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Grimório</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>

<!-- Aqui a gente "chama" o menu que está no arquivo menu.html -->
<nav th:replace="~{menu :: menu}"></nav>

<h1>Meu Grimório</h1>

<!-- th:if só mostra essa linha se a variável existir (não for nula).
     As variáveis "sucesso" e "erro" vêm do controller, por exemplo
     depois de excluir uma magia. -->
<p th:if="${sucesso}" class="sucesso" th:text="${sucesso}"></p>
<p th:if="${erro}" class="erro" th:text="${erro}"></p>

<!-- Esse formulário usa method="get", então os valores preenchidos viram
     parte do endereço, tipo: /magias?classe=wizard&nivel=3
     O controller MagiaController.listar() recebe esses valores nos
     parâmetros @RequestParam. -->
<form method="get" action="/magias" class="filtros">
    <!-- th:value deixa o campo já preenchido com o filtro usado antes,
         assim ele não "esquece" o que o usuário digitou ao recarregar. -->
    <input type="text" name="classe" placeholder="classe (ex: wizard)" th:value="${classe}">

    <select name="nivel">
        <option value="">nível</option>
        <!-- th:selected marca a opção certa, comparando com o valor que
             veio do controller -->
        <option value="0" th:selected="${nivel == 0}">Truque</option>
        <!-- #numbers.sequence(1, 9) gera uma listinha com os números de
             1 até 9, e o th:each repete essa <option> uma vez para cada
             número -->
        <option th:each="n : ${#numbers.sequence(1, 9)}" th:value="${n}" th:text="${n}"
                th:selected="${nivel == n}"></option>
    </select>

    <select name="componente">
        <option value="">componente</option>
        <option value="V" th:selected="${componente == 'V'}">V</option>
        <option value="S" th:selected="${componente == 'S'}">S</option>
        <option value="M" th:selected="${componente == 'M'}">M</option>
    </select>

    <button type="submit">Filtrar</button>
    <a href="/magias">Limpar</a>
</form>

<a href="/magias/nova">+ Nova magia</a>
<a href="/buscar">Buscar na API</a>

<!-- #lists.isEmpty verifica se a lista "magias" está vazia -->
<p th:if="${#lists.isEmpty(magias)}">Nenhuma magia encontrada.</p>

<!-- th:each repete essa <div> inteira uma vez para CADA magia da lista.
     Dentro dela, a variável "magia" representa a magia da vez. -->
<div th:each="magia : ${magias}" class="carta">

    <!-- Botão de estrela. data-id guarda o id da magia escondido no HTML,
         para o JavaScript (preparadas.js) saber qual magia marcar.
         onclick chama a função "alternar", passando esse id. -->
    <button class="favorito" th:attr="data-id=${magia.id}" onclick="alternar(this.getAttribute('data-id'))">☆</button>

    <!-- th:text troca o conteúdo da tag pelo valor da variável -->
    <h3 th:text="${magia.nome}">Nome</h3>
    <p th:text="'Nível ' + ${magia.nivel} + ' - ' + ${magia.escola}"></p>
    <p th:text="'Componentes: ' + ${magia.componentes}"></p>
    <p th:text="'Classes: ' + ${magia.classes}"></p>

    <!-- @{...} monta o endereço certo, trocando {id} pelo id de verdade.
         Isso chama o método editar() do MagiaController. -->
    <a th:href="@{/magias/{id}/editar(id=${magia.id})}">Editar</a>

    <!-- Esse formulário é um POST porque excluir é uma ação que MUDA o
         banco de dados (formulários GET são só para ler/filtrar coisas).
         onsubmit mostra uma confirmação antes de excluir de verdade. -->
    <form th:action="@{/magias/{id}/excluir(id=${magia.id})}" method="post" style="display:inline"
          onsubmit="return confirm('Excluir esta magia?')">
        <button type="submit">Excluir</button>
    </form>
</div>

<!-- Carrega o JavaScript que cuida da estrela e do localStorage -->
<script src="/js/preparadas.js"></script>
</body>
</html>
