<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Meu Grimório</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>

<nav th:replace="~{menu :: menu}"></nav>

<h1>Meu Grimório</h1>

<p th:if="${sucesso}" class="sucesso" th:text="${sucesso}"></p>
<p th:if="${erro}" class="erro" th:text="${erro}"></p>

<form method="get" action="/magias" class="filtros">
    <input type="text" name="classe" placeholder="classe (ex: wizard)" th:value="${classe}">

    <select name="nivel">
        <option value="">nível</option>
        <option value="0" th:selected="${nivel == 0}">Truque</option>
        <option th:each="n : ${#numbers.sequence(1, 9)}" th:value="${n}" th:text="${n}"
                th:selected="${nivel == n}"></option>
    </select>

    <select name="componente">
        <option value="">componente</option>
        <option value="V" th:selected="${componente == 'V'}">V</option>
        <option value="S" th:selected="${componente == 'S'}">S</option>
        <option value="M" th:selected="${componente == 'M'}">M</option>
    </select>

    <button type="submit">Filtrar</button>
    <a href="/magias">Limpar</a>
</form>

<a href="/magias/nova">+ Nova magia</a>
<a href="/buscar">Buscar na API</a>

<p th:if="${#lists.isEmpty(magias)}">Nenhuma magia encontrada.</p>

<div th:each="magia : ${magias}" class="carta">
    <button class="favorito" th:attr="data-id=${magia.id}" onclick="alternar(this.getAttribute('data-id'))">☆</button>
    <h3 th:text="${magia.nome}">Nome</h3>
    <p th:text="'Nível ' + ${magia.nivel} + ' - ' + ${magia.escola}"></p>
    <p th:text="'Componentes: ' + ${magia.componentes}"></p>
    <p th:text="'Classes: ' + ${magia.classes}"></p>
    <a th:href="@{/magias/{id}/editar(id=${magia.id})}">Editar</a>
    <form th:action="@{/magias/{id}/excluir(id=${magia.id})}" method="post" style="display:inline"
          onsubmit="return confirm('Excluir esta magia?')">
        <button type="submit">Excluir</button>
    </form>
</div>

<script src="/js/preparadas.js"></script>
</body>
</html>
