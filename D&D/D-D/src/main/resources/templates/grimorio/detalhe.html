<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/layout :: cabecalho('Magia')}"></head>

<body>

    <header th:replace="~{fragments/layout :: menu('grimorio')}"></header>

    <main class="conteudo estreito">

        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <article class="painel pergaminho" th:attr="data-magia-id=${magia.id}">

            <div class="carta-topo">
                <span class="selo-nivel" th:text="${magia.nivelFormatado}">Truque</span>
                <button type="button" class="estrela" th:attr="data-preparar=${magia.id}"
                    title="Marcar como preparada neste navegador">☆</button>
            </div>

            <h1 th:text="${magia.nome}">Nome da magia</h1>
            <p class="carta-resumo" th:text="${magia.resumo}">Escola - nível</p>

            <ul class="etiquetas">
                <li class="etiqueta" th:each="comp : ${magia.listaComponentes}"
                    th:text="${comp.sigla} + ' · ' + ${comp.nome}" th:title="${comp.explicacao}">V</li>
                <li class="etiqueta destaque" th:if="${magia.ritual}">Ritual</li>
                <li class="etiqueta destaque" th:if="${magia.concentracao}">Concentração</li>
                <li class="etiqueta api" th:if="${magia.origemApi}">Importada da API</li>
            </ul>

            <dl class="ficha">
                <div>
                    <dt>Tempo de conjuração</dt>
                    <dd th:text="${magia.tempoConjuracao} ?: '—'">1 ação</dd>
                </div>
                <div>
                    <dt>Alcance</dt>
                    <dd th:text="${magia.alcance} ?: '—'">18 m</dd>
                </div>
                <div>
                    <dt>Duração</dt>
                    <dd th:text="${magia.duracao} ?: '—'">Instantânea</dd>
                </div>
                <div>
                    <dt>Componentes</dt>
                    <dd th:text="${magia.componentesFormatados}">V, S, M</dd>
                </div>
                <div th:if="${magia.materiais}">
                    <dt>Materiais</dt>
                    <dd th:text="${magia.materiais}">...</dd>
                </div>
                <div>
                    <dt>Classes</dt>
                    <dd th:text="${magia.classesFormatadas}">Mago</dd>
                </div>
            </dl>

            <h2>Descrição</h2>
            <p class="texto-longo" th:text="${magia.descricao} ?: 'Sem descrição cadastrada.'">...</p>

            <div th:if="${magia.niveisSuperiores}">
                <h2>Em níveis superiores</h2>
                <p class="texto-longo" th:text="${magia.niveisSuperiores}">...</p>
            </div>

            <div th:if="${magia.anotacoes}">
                <h2>Minhas anotações</h2>
                <p class="texto-longo anotacao" th:text="${magia.anotacoes}">...</p>
            </div>

            <div class="campo-botoes">
                <a class="botao" th:href="@{/grimorio/{id}/editar(id=${magia.id})}">Editar</a>
                <a class="botao texto" th:href="@{/grimorio}">Voltar ao grimório</a>
                <form method="post" th:action="@{/grimorio/{id}/excluir(id=${magia.id})}"
                    onsubmit="return confirm('Remover esta magia do grimório?');">
                    <button type="submit" class="botao texto perigo">Excluir</button>
                </form>
            </div>
        </article>

    </main>

    <footer th:replace="~{fragments/layout :: rodape}"></footer>
    <script th:src="@{/js/preparadas.js}"></script>
</body>

</html>
